---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Bootstrap uses 1Password (op inject) for the root secrets — no SOPS, no talhelper.
# Talos secrets live in the 1Password `talos` item; machine configs render from
# talos/*.yaml.j2. See .taskfiles/talos for the render/apply pipeline.

tasks:
  talos:
    desc: Bootstrap the Talos cluster (initial install from maintenance mode)
    dir: "{{.TALOS_DIR}}"
    vars:
      # A reachable control-plane node IP to bootstrap etcd against
      CONTROLLER: "10.13.17.22"
    cmds:
      # Apply every node's rendered config in maintenance mode (insecure)
      - |
        for f in nodes/controlplane/*.yaml.j2 nodes/worker/*.yaml.j2; do
          node=$(basename "$f" .yaml.j2)
          echo "Applying $node ..."
          task talos:apply-node NODE="$node" INSECURE=true || true
        done
      - until talosctl -n {{.CONTROLLER}} bootstrap; do sleep 10; done
      - until talosctl -n {{.CONTROLLER}} kubeconfig --force {{.ROOT_DIR}}; do sleep 10; done
    preconditions:
      - msg: "op CLI not signed in (run: eval $(op signin))"
        sh: op whoami
      - which minijinja-cli op talosctl yq jq curl

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - msg: "op CLI not signed in (run: eval $(op signin))"
        sh: op whoami
      - test -f {{.KUBECONFIG}}
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
