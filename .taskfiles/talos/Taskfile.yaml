---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Talos machine configs are rendered from Jinja templates in talos/, with
# secrets resolved from 1Password at render time:
#   minijinja-cli <tmpl> | op inject  ->  talosctl machineconfig patch
# No talhelper, no SOPS. Requires: minijinja-cli, op (signed in), talosctl, yq, jq, curl.

tasks:
  schematic-id:
    desc: Print the Image Factory schematic ID
    dir: "{{.TALOS_DIR}}"
    silent: true
    cmd: curl -sX POST --data-binary @<(minijinja-cli schematic.yaml.j2) https://factory.talos.dev/schematics | jq -r '.id'

  render:
    desc: Render a node's full machine config to stdout [NODE=required]
    dir: "{{.TALOS_DIR}}"
    silent: true
    cmd: |
      role=$(test -f "nodes/controlplane/{{.NODE}}.yaml.j2" && echo controlplane || echo worker)
      schematic=$(curl -sX POST --data-binary @<(minijinja-cli schematic.yaml.j2) https://factory.talos.dev/schematics | jq -r '.id')
      talosctl machineconfig patch \
        <(minijinja-cli machineconfig.yaml.j2 -D schematic="$schematic" | op inject) \
        --patch @<(minijinja-cli "${role}.yaml.j2" | op inject) \
        --patch @<(minijinja-cli "nodes/${role}/{{.NODE}}.yaml.j2" | op inject)
    requires:
      vars: [NODE]
    preconditions:
      - msg: "op CLI not signed in (run: eval $(op signin))"
        sh: op whoami
      - which minijinja-cli op talosctl jq curl

  diff:
    desc: Dry-run a node's rendered config against what's applied [NODE=required]
    dir: "{{.TALOS_DIR}}"
    cmd: |
      role=$(test -f "nodes/controlplane/{{.NODE}}.yaml.j2" && echo controlplane || echo worker)
      ip=$(minijinja-cli "nodes/${role}/{{.NODE}}.yaml.j2" | yq 'select(.kind == "LinkConfig") | .addresses[0].address' | cut -d/ -f1)
      task talos:render NODE={{.NODE}} | talosctl -n "$ip" apply-config --dry-run --mode=auto -f /dev/stdin
    requires:
      vars: [NODE]

  apply-node:
    desc: Apply a node's rendered config [NODE=required] [MODE=auto]
    dir: "{{.TALOS_DIR}}"
    vars:
      MODE: '{{.MODE | default "auto"}}'
    cmd: |
      role=$(test -f "nodes/controlplane/{{.NODE}}.yaml.j2" && echo controlplane || echo worker)
      ip=$(minijinja-cli "nodes/${role}/{{.NODE}}.yaml.j2" | yq 'select(.kind == "LinkConfig") | .addresses[0].address' | cut -d/ -f1)
      task talos:render NODE={{.NODE}} | talosctl -n "$ip" apply-config --mode={{.MODE}} -f /dev/stdin
    requires:
      vars: [NODE]
    preconditions:
      - msg: "op CLI not signed in (run: op signin)"
        sh: op whoami

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    dir: "{{.TALOS_DIR}}"
    vars:
      SCHEMATIC:
        sh: task talos:schematic-id
      # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
      TALOS_VERSION: v1.13.7
    cmd: |
      role=$(test -f "nodes/controlplane/{{.NODE}}.yaml.j2" && echo controlplane || echo worker)
      ip=$(minijinja-cli "nodes/${role}/{{.NODE}}.yaml.j2" | yq 'select(.kind == "LinkConfig") | .addresses[0].address' | cut -d/ -f1)
      talosctl -n "$ip" upgrade \
        --image="factory.talos.dev/metal-installer/{{.SCHEMATIC}}:{{.TALOS_VERSION}}" \
        --timeout=10m
    requires:
      vars: [NODE]

  upgrade-k8s:
    desc: Upgrade Kubernetes across the cluster
    dir: "{{.TALOS_DIR}}"
    vars:
      CONTROLLER:
        sh: talosctl config info -o yaml | yq -r '.endpoints[0]'
      # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
      KUBERNETES_VERSION: v1.36.3
    cmd: talosctl -n {{.CONTROLLER}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    preconditions:
      - talosctl config info

  reset:
    desc: Reset nodes back to maintenance mode (DESTRUCTIVE)
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    vars:
      NODES:
        sh: talosctl config info -o yaml | yq -r '.nodes | join(" ")'
    cmd: talosctl -n {{.NODES}} reset --reboot --graceful=false --wait=false
