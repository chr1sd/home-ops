---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps the minimal core so Flux can take over. Each release's chart,
# version, and values come from its app manifests under kubernetes/apps, so
# bootstrap installs exactly what Flux will reconcile (single source of truth).
# Ordering is a linear `needs:` chain ending at flux-operator -> flux-instance.

helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

bases:
  - default.yaml

defaultInherit: default

releases:
  - name: cilium
    namespace: kube-system

  - name: coredns
    namespace: kube-system
    needs:
      - kube-system/cilium

  - name: spegel
    namespace: kube-system
    needs:
      - kube-system/coredns

  - name: cert-manager
    namespace: cert-manager
    needs:
      - kube-system/spegel

  - name: external-secrets
    namespace: external-secrets
    needs:
      - cert-manager/cert-manager

  - name: onepassword-connect
    namespace: external-secrets
    hooks:
      - # Wait for the ClusterSecretStore CRD before applying the store
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/clustersecretstores.external-secrets.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - # Apply the ClusterSecretStore so ExternalSecrets can resolve
        command: kubectl
        args:
          - apply
          - --server-side
          - --force-conflicts
          - --filename=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/app/clustersecretstore.yaml
        events:
          - postsync
        showlogs: true
    needs:
      - external-secrets/external-secrets

  - name: flux-operator
    namespace: flux-system
    needs:
      - external-secrets/onepassword-connect

  - name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
