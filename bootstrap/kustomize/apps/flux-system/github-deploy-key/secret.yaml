---
# Flux git pull secret (SSH). Applied at bootstrap via `op inject` before Flux
# starts, since ESO does not exist yet. Keys `identity` and `known_hosts` are
# required by Flux's GitRepository SSH auth.
apiVersion: v1
kind: Secret
metadata:
  name: github-deploy-key
stringData:
  identity: op://k8s/github-deploy-key/identity
  known_hosts: op://k8s/github-deploy-key/known_hosts
