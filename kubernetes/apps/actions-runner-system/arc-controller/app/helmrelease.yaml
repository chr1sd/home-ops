---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  # Actions Runner Controller: watches AutoscalingRunnerSets (one per repo scale set,
  # see ../arc-runners) and starts a runner pod per queued job. Vault: Project - Build a
  # CI CD Pipeline for the Homelab, phase 1; first consumer is the AI PR review workflow.
  values:
    flags:
      logLevel: info
