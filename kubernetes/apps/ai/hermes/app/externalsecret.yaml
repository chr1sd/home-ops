---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes
    template:
      data:
        # Discord: the gateway enables the platform from the token's presence. Cron
        # jobs deliver to DISCORD_HOME_CHANNEL; only DISCORD_ALLOWED_USERS may talk to it.
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN }}"
        DISCORD_ALLOWED_USERS: "{{ .DISCORD_ALLOWED_USERS }}"
        DISCORD_HOME_CHANNEL: "{{ .DISCORD_HOME_CHANNEL }}"
        # The home channel is mention-free: talk to the bot there without @goatbot and it
        # replies inline instead of opening a thread per message (Discord rate-limits
        # thread creation per channel; auto-threads still apply to @mentions elsewhere).
        DISCORD_FREE_RESPONSE_CHANNELS: "{{ .DISCORD_HOME_CHANNEL }}"
        # Dashboard on a non-loopback bind fails closed without an auth provider.
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .DASHBOARD_USERNAME }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .DASHBOARD_PASSWORD }}"
  dataFrom:
    - extract:
        key: hermes
