---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Encrypts credentials LiteLLM stores in Postgres. Never rotate: stored keys
        # become unreadable.
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        DATABASE_URL: "postgresql://litellm:{{ .DATABASE_PASSWORD }}@postgres17-rw.database.svc.cluster.local:5432/litellm"
  dataFrom:
    - extract:
        key: litellm
