---
# The single front door for every LLM consumer (vault: Project - AI Node and LLM Stack,
# phase 5). Clients use stable aliases (models.yaml); this proxy owns the fallbacks.
# Shape from joryirving/home-ops litellm/litellmproxy.yaml minus SSO and the cloud
# providers: models are local-only for now. Redis is the per-app Dragonfly from
# components/dragonfly (ks.yaml): router state survives restarts and embeddings are
# cached, and it is the prerequisite for running more than one replica.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm-database:v1.103.2@sha256:bf6d8e366f41dfe44bffad59d996f4753710e0529e5ff648c2305829835c2ab7
  replicas: 1
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - litellm.dovis.me
    parentRefs:
      - name: envoy-internal
        namespace: network
  # Admin API auth for the operator (virtual keys). UI login: user `admin`, password = master key.
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: PROXY_BASE_URL
      value: https://litellm.dovis.me
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm
          key: DATABASE_URL
    # Dragonfly (Service + generated password Secret both named litellm-dragonfly)
    - name: REDIS_HOST
      value: litellm-dragonfly
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-dragonfly
          key: password
  envFrom:
    - secretRef:
        name: litellm
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  routerSettings:
    # cooldowns / per-key usage counters live in Dragonfly instead of process memory
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    # Each lane fails over to the other card; the -chat doors stay non-thinking.
    fallbacks:
      - qwen3.8-27b:
          - gemma-4-31b-it-qat
      - qwen3.8-27b-chat:
          - gemma-4-31b-it-qat-chat
      - gemma-4-31b-it-qat:
          - qwen3.8-27b
      - gemma-4-31b-it-qat-chat:
          - qwen3.8-27b-chat
  litellmSettings:
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    require_auth_for_metrics_endpoint: false
    # Cache embeddings only: memini and Open WebUI RAG re-embed the same texts, the
    # result is deterministic, and the CPU embed lane is the slowest thing we run.
    # Chat completions are never cached.
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
      ttl: 3600
      supported_call_types:
        - embedding
        - aembedding
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
