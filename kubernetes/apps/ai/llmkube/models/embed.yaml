---
# Embeddings on CPU, on the MS01s (no taint toleration, no GPU): the device plugin
# cannot share a card without time-slicing, and a 0.6B embedder is a CPU-sized job —
# jory runs the same model on CPU. Keeps GPU 1 whole for the reviewer lane.
# Shape from joryirving/home-ops llm/embed/{model,embed-1}.yaml, single replica.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: hf://Qwen/Qwen3-Embedding-0.6B-GGUF
  files:
    - Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed
spec:
  modelRef: embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  mode: embedding
  # Embedding inputs are single passages capped by uBatchSize (2048 tokens), so a large
  # context only buys KV cache: at 32768 this model idled at 3.6 GiB and OOM-killed on
  # the first batch inside a 4Gi limit (48 restarts/day). 8192 unified across the slots
  # idles under 1 GiB — the reranker runs the same way at ~200 MiB.
  contextSize: 8192
  parallelSlots: 8
  flashAttention: true
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: "2"
    memory: 4Gi
  extraArgs:
    - --alias
    - embed
    - --pooling
    - last
    - --cont-batching
    - --cache-ram
    - "0"
    - --kv-unified
    - --threads
    - "4"
    - --threads-batch
    - "8"
    - --load-mode
    - mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
