# GPU 1 lane: reviewer / second opinion, sharing its card with ComfyUI (claim
# gpu-shared, resourceclaims.yaml). Back to the 12B after the 31B experiment (#1233):
# the 31B filled 21.6 GB and left no room for image generation, the 12B measured
# 8.9 GB at 131k ctx / 2 slots and 79 tok/s, which leaves ~15 GB for ComfyUI.
# Google-recommended sampling: temp 1.0, top-p 0.95, top-k 64.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: gemma-4-12b-it-qat
spec:
  source: hf://unsloth/gemma-4-12B-it-qat-GGUF
  files:
    - gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
    - mmproj-F16.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      layers: 99
      # DRA: shared with ComfyUI, so both always land on the same card
      resourceClaims:
        - name: gpu
          resourceClaimName: gpu-shared
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma-4-12b-it-qat
spec:
  modelRef: gemma-4-12b-it-qat
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:fff6185edd2fbc4093aa5970bf6db53ed11c283e3a1c52a3e244cf27047264f4
  rolloutPolicy:
    waitForIdle: false # https://github.com/defilantech/LLMKube/pull/1794
    idleTimeoutSeconds: 86400
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 131072
  flashAttention: true
  jinja: true
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  resources:
    cpu: "500m"
    # Measured: ~0.7 GiB for the server + the --cache-ram prompt cache once it fills, plus
    # 1-3 GiB transient per request (a new cache entry is built before the oldest is
    # evicted). An 8 GiB cache sat at 8.7 GiB and was OOM-killed in a review burst; a
    # 4 GiB cache leaves ~7 GiB of burst headroom.
    memory: 12Gi
  extraArgs:
    - --alias
    - gemma-4-12b-it-qat
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --cache-prompt
    - --cache-ram
    - "4096"
    - --kv-unified
    - --temp
    - "1"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --min-p
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "4"
    - --threads-batch
    - "8"
    - --load-mode
    - none
    - --n-predict
    - "16384"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
