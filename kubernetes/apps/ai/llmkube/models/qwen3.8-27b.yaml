---
# GPU 0 lane: general + coding + vision. This is joryirving's last llama.cpp config for
# the same card (home-ops@b570ccd3, before his 2026-09-11 move to vLLM), adapted for
# this node: tolerates the llm-workload taint, selects on nvidia.com/gpu.present, no
# HF token (unsloth is public), no gpu-preemptible PriorityClass, and host-side sizes
# cut for an i7-6700K with 64 GB (4c/8t threads, 16 GiB prompt cache, 32Gi limit vs
# his 6/12 threads, 40 GiB cache, 64Gi). Context/KV/slots are his measured values.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b
spec:
  source: hf://unsloth/Qwen3.8-27B-GGUF
  files:
    - Qwen3.8-27B-UD-Q4_K_XL.gguf
    - mmproj-F16.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-27b
spec:
  modelRef: qwen3.8-27b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:1f4b9cf58982dd4d7cc497aea31b1a456ca9a3a1f94f527d317d3fdee0d60ab6
  rolloutPolicy:
    waitForIdle: false # https://github.com/defilantech/LLMKube/pull/1794
    idleTimeoutSeconds: 86400
  runtimeClassName: nvidia
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 131072
  flashAttention: true
  jinja: true
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 32768
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  resources:
    gpu: 1
    cpu: "500m"
    memory: 32Gi
  # The UD-Q4_K_XL file carries the model's MTP head; no separate draft model.
  speculativeDecoding:
    type: draft-mtp
    nDraftMax: 2
    pMin: 0.75
  extraArgs:
    - --alias
    - qwen3.8-27b
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - -sps
    - "0.75"
    - --cache-prompt
    - --cache-ram
    - "16384"
    - --kv-unified
    - --temp
    - "1"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "4"
    - --threads-batch
    - "8"
    - --load-mode
    - none
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
    - --reasoning-preserve
    - --n-predict
    - "40960"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
