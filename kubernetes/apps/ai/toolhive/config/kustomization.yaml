---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./mcpgroup.yaml
  - ./kubectl-mcp.yaml
  - ./flux-mcp.yaml
  - ./talos-mcp.yaml
  - ./memini-proxy.yaml
  - ./virtualmcpserver.yaml
  - ./externalsecret.yaml
  - ./httproute.yaml
  - ./securitypolicy.yaml
patches:
  # ToolHive's session-storage Lua scripts touch keys they do not declare, which
  # Dragonfly rejects by default. Applies to the Dragonfly CR that components/dragonfly
  # (ks.yaml) adds to this build.
  - target:
      group: dragonflydb.io
      version: v1alpha1
      kind: Dragonfly
    patch: |-
      - op: add
        path: /spec/args/-
        value: --default_lua_flags=allow-undeclared-keys
