---
sonarr:
  series:
    base_url: http://sonarr.default.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    media_management:
      propers_and_repacks: do_not_prefer

    # Quality Definition
    # This section defines the Quality Definitions that will be used in your Sonarr instance
    # Only one set of Quality Definitions can be used per instance
    # Documentation: https://recyclarr.dev/wiki/yaml/config-reference/#quality-def-settings
    quality_definition:
      type: series

    delete_old_custom_formats: true

    media_naming:
      series: plex-imdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    # Quality Profiles
    # This section creates and/or updates Quality Profile(s) in your Sonarr instance
    # Documentation: https://recyclarr.dev/wiki/yaml/config-reference/#quality-profiles
    quality_profiles:
      - name: BLURAY-2160p
        reset_unmatched_scores: &sonarr_reset_unmatched
          enabled: true
          except:
            - "Language: Not Original or English"
            - "Language: Prefer Original"
            - "Language: German + Original"
            - "Home Groups"
            - "Home Groups 2"
            - "Sign Languages"
        upgrade:
          allowed: true
          until_quality: &remux-2160p Bluray-2160p Remux
          until_score: 10000
        min_format_score: 0
        qualities:
          - name: *remux-2160p
          - name: Bluray-2160p
          - name: &remux-1080p Bluray-1080p Remux
          - name: WEBDL-2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEBDL-1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEBDL-720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
              - DVD

      - name: BLURAY-1080p
        reset_unmatched_scores: *sonarr_reset_unmatched
        upgrade:
          allowed: true
          until_quality: *remux-1080p
          until_score: 10000
        min_format_score: 0
        qualities:
          - name: *remux-1080p
          - name: Bluray-1080p
          - name: WEBDL-1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEBDL-720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-480p
          - name: Bluray-576p
          - name: 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
              - DVD

      - name: WEBDL
        reset_unmatched_scores: *sonarr_reset_unmatched
        upgrade:
          allowed: true
          until_quality: WEBDL-2160p
          until_score: 10000
        min_format_score: 0
        qualities:
          - name: WEBDL-2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-2160p
          - name: WEBDL-1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - Bluray-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEBDL-720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
              - DVD

      - name: OLD SHOWS
        reset_unmatched_scores: *sonarr_reset_unmatched
        upgrade:
          allowed: true
          until_quality: Any Quality
          until_score: 10000
        min_format_score: 0
        qualities:
          - name: Any Quality
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
              - Bluray-2160p
              - WEBDL-1080p
              - WEBRip-1080p
              - Bluray-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
              - Bluray-576p
              - Bluray-480p
              - WEBDL-480p
              - WEBRip-480p
              - DVD

    # Custom Formats
    # This section creates and/or updates Custom Formats in your Sonarr instance,
    # and applies them and their scores to Quality Profiles
