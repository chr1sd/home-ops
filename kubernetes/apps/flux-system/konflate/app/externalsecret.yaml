---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Konflate acts as the kevernetes GitHub App (the Renovate/review identity): it mints
# its own short-lived installation tokens for reading the repo and for write-back
# (Check Run + summary comment). Two 1Password items in vault k8s:
#   github-bot  — BOT_APP_CLIENT_ID, BOT_APP_PRIVATE_KEY (PEM; set with `op item edit`
#                 so the newlines survive — see the ARC lesson in the vault plan)
#   konflate    — KONFLATE_WEBHOOK_SECRET (random string; also pasted into the GitHub
#                 webhook that points at https://konflate-webhook.dovis.me/hooks)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: konflate
    template:
      data:
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
        KONFLATE_APP_CLIENT_ID: "{{ .BOT_APP_CLIENT_ID }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: konflate
    - extract:
        key: github-bot
