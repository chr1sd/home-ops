---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-bedrock
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn: []
  values:
    fullnameOverride: *app
    image:
      repository: itzg/minecraft-bedrock-server
      tag: 2026.8.1@sha256:27210cf47597673bde6d8edf60f3f52f79267cbb6bdc5e6255fa4d200810eca2
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 4Gi
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft-bedrock
    livenessProbe:
      initialDelaySeconds: 30
    readinessProbe:
      initialDelaySeconds: 30
    startupProbe:
      enabled: true
    extraEnv:
      TZ: America/New_York
    serviceAnnotations:
      lbipam.cilium.io/ips: "10.13.17.51"
      external-dns.alpha.kubernetes.io/hostname: "minecraft-bedrock.dovis.me"
    minecraftServer:
      eula: "TRUE"
      version: "LATEST"
      serverName: "dingleDANGLE"
      levelName: "Bedrock level"
      gameMode: survival
      difficulty: normal
      enableLanVisibility: true
      maxPlayers: 10
      serviceType: LoadBalancer
      serverPort: 19132
