---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: lil-nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: lil-nas.dovis.me
          path: /mnt/seagate-data/k8s/backup
  # Adopt the existing VolSync kopia repository — never initialize a new one
  create:
    enabled: false
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  # Match the perfectra1n fork's snapshot identity (<app>@<namespace>) so
  # history continues; sourcePathOverride /data is pinned in the component
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    enabled: true
    # The fork's KopiaMaintenance owned the maintenance lease for 211 days;
    # take it over rather than waiting for the stale lease to expire
    takeoverPolicy: Force
    # A run wedged on dead NFSv4 state hangs forever (0 CPU, D-state unlinks);
    # kill it after 6h so the next scheduled run gets a fresh mount
    failurePolicy:
      activeDeadlineSeconds: 21600
  # Busy repo (21 apps x hourly): let epochs close sooner than kopia's 24h
  # default so index-blob compaction keeps up (TooManyIndexBlobs warning)
  parameters:
    epoch:
      minDuration: 6h
  moverDefaults:
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    ttlSecondsAfterFinished: 300
  scheduleDefaults:
    timezone: America/New_York
  # Built-in kopia web UI (replaces the old volsync-system kopia app);
  # login creds live in Secret lil-nas-kopia-ui-auth
  server:
    namespace: kopiur-system
    readOnly: true
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
