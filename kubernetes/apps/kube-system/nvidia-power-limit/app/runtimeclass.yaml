---
# containerd handler from the Talos nvidia-container-toolkit extension. Since the move
# to DRA only this DaemonSet uses it (it needs every card for nvidia-smi -pl); GPU
# workloads get their card from a ResourceClaim and run on plain runc with CDI.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
