---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  values:
    # CRDs are managed separately: Gateway API CRDs by the gateway-api-crds
    # HelmRelease (wiremind), the gateway.envoyproxy.io CRDs by the bootstrap
    # crds stage. Letting this chart also apply Gateway API CRDs conflicts with
    # the newer wiremind set (tcproutes storedVersion v1 cannot be removed).
    crds:
      enabled: false
    global:
      imageRegistry: mirror.gcr.io
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
