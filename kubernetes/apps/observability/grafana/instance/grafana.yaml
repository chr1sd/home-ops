---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  # Pinned so Renovate can bump it. Left empty, the operator writes its default
  # into the live object once and never updates it again.
  # renovate: datasource=docker depName=docker.io/grafana/grafana
  version: 13.2.3
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "true"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
      # Grafana 13.2 ships the core datasources (prometheus, loki, ...) as bundled
      # plugins under /usr/share/grafana and auto-updates them at startup. With a
      # read-only root filesystem the update fails after the plugin is unregistered,
      # leaving every Prometheus panel on "No data" (plugin.notRegistered). Keep the
      # versions bundled with the image; Renovate bumps them with Grafana itself.
      preinstall_auto_update: "false"
    security:
      angular_support_enabled: "true"
      allow_embedding: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.dovis.me
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_INSTALL_PLUGINS
                  value: "victoriametrics-logs-datasource"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    spec:
      hostnames:
        - grafana.dovis.me
      parentRefs:
        - name: envoy-internal
          namespace: network
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
