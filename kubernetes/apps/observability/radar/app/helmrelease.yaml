---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  interval: 1h
  chart:
    spec:
      chart: radar
      version: 1.14.1
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/skyhook-io/radar
      tag: 1.14.1@sha256:8fda6d4c3e8052fb22026046b266f8a70a89e4f9db813a0316ccd668b41fad1d
    rbac:
      # Hubble relay isn't deployed yet (cilium hubble.enabled: false) - no traffic
      # map source to read. Flip to true once Hubble is enabled cluster-wide.
      traffic: false
