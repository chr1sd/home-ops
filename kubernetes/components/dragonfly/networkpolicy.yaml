---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
# The operator creates a NetworkPolicy per instance (networkPolicyEnabled defaults to
# true) that opens 6379 to the instance's own namespace only and the admin port 9999
# to the operator and peer pods only. Policies are additive, so this one lets
# Prometheus reach /metrics on 9999 (the PodMonitor target).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP}-dragonfly-prometheus-metrics
spec:
  podSelector:
    matchLabels:
      app: ${APP}-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9999
