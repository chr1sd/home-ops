---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Random password minted by external-secrets itself; nothing is stored in 1Password.
# No symbols so the value is safe inside a redis:// URL without escaping.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-dragonfly
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-dragonfly
spec:
  # Mint once and keep: Dragonfly and its clients only read the password at pod start,
  # so a rotating value would silently desync them. Deleting the Secret regenerates it
  # — restart the Dragonfly pods and the client afterwards.
  refreshPolicy: CreatedOnce
  target:
    name: ${APP}-dragonfly
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-dragonfly
